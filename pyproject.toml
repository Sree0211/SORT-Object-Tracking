[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sort-tracker"
version = "0.1.0"
description = "SORT (Simple Online and Realtime Tracking) implemented from scratch"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy", "scipy", "opencv-python", "matplotlib"]

[tool.setuptools]
packages = ["sort"]
